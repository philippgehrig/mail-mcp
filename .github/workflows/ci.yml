name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test

  integration-tests:
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.2
        ports:
          - 3025:3025
          - 3143:3143
        env:
          GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=test:password123@localhost.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Wait for GreenMail
        run: |
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/3143) 2>/dev/null && break
            sleep 1
          done
      - run: npm run test:integration
        env:
          IMAP_HOST: localhost
          IMAP_PORT: "3143"
          SMTP_HOST: localhost
          SMTP_PORT: "3025"
          MAIL_USER: test
          MAIL_PASSWORD: password123
          MAIL_FROM: test@localhost.com
